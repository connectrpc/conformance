name: Buf CI
on:
  push:
    paths:
      - '**.proto'
      - '**/buf.yaml'
      - '**/buf.lock'
      - '**/buf.md'
      - '**/README.md'
      - '**/LICENSE'
      - '.github/workflows/buf-ci.yaml'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  delete:
permissions:
  contents: read
  pull-requests: write
jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          breaking_against: 'buf.build/connectrpc/conformance'
          token: ${{ secrets.BUF_TOKEN }}
          # Only sync main and release tags to the BSR, not other branches.
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && !github.event.repository.fork }}
          archive: ${{ github.event_name == 'delete' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v') && !github.event.repository.fork }}
