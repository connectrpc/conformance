name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # support manual runs
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs; let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    name: ci (go:${{ matrix.go-version.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # When changing this, also update the Go version in the lint and
        # checkrelease jobs below and in release.yaml to match 'latest'.
        go-version:
        - name: latest
          version: 1.27.x
        - name: previous
          version: 1.26.x
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version.version }}
          # Each job keys its own cache on the files that pin its tools.
          cache-dependency-path: |
            go.sum
            Makefile
      - name: Test
        run: make test
      - name: Run Conformance Tests
        run: make runconformance
  lint:
    # Often, lint & gofmt guidelines depend on the Go version. To prevent
    # conflicting guidance, run only on the most recent supported version.
    # For the same reason, only check generated code on the most recent
    # supported version.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          # Keep in sync with the 'latest' Go version above.
          go-version: 1.27.x
          # Each job keys its own cache on the files that pin its tools.
          cache-dependency-path: |
            go.sum
            Makefile
            .golangci.yml
      - name: Check Generated Code
        run: make generate && make checkgenerate
      - name: Lint
        run: make lint
  checkrelease:
    # Releases are built with the most recent supported Go version, so that's
    # all we need to check.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          # Keep in sync with the 'latest' Go version above.
          go-version: 1.27.x
          # Each job keys its own cache on the files that pin its tools.
          cache-dependency-path: |
            go.sum
            Makefile
            .goreleaser.yml
      - name: Check Release
        run: make checkrelease
