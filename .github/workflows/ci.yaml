name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # support manual runs
permissions:
  contents: read
jobs:
  ci:
    name: ci (go:${{ matrix.go-version.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # When changing this, also update the Go version in release.yaml to
        # match 'latest'.
        go-version:
        - name: latest
          version: 1.27.x
        - name: previous
          version: 1.26.x
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version.version }}
          # The Makefile pins the lint and release tool versions.
          cache-dependency-path: |
            go.sum
            Makefile
      - name: Test
        run: make test
      - name: Run Conformance Tests
        run: make runconformance
      - name: Lint
        # Often, lint & gofmt guidelines depend on the Go version. To prevent
        # conflicting guidance, run only on the most recent supported version.
        # For the same reason, only check generated code on the most recent
        # supported version.
        if: matrix.go-version.name == 'latest'
        run: make checkgenerate && make lint
      - name: Check Release
        # We'll only be building releases w/ latest Go, so we only need to
        # test that it can be built w/ latest.
        if: matrix.go-version.name == 'latest'
        run: make checkrelease
