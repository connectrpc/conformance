name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # support manual runs
permissions:
  contents: read
concurrency:
  # A new push to a PR cancels that PR's previous run. Every other run gets
  # its own group, so runs on main never queue behind or cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  ci:
    name: ci (go:${{ matrix.go-version.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # When changing this, also update the Go version in the lint and
        # checkrelease jobs below and in release.yaml to match 'latest'.
        go-version:
        - name: latest
          version: 1.27.x
        - name: previous
          version: 1.26.x
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version.version }}
          cache: false
      # Each job caches its own module and build caches. Makefile is in the
      # key so that a tool version bump saves a fresh cache, and restore-keys
      # falls back to the previous one rather than starting cold.
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.sum', 'Makefile') }}
          restore-keys: ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-${{ github.job }}-
      - name: Test
        run: make test
      - name: Run Conformance Tests
        run: make runconformance
      - name: Check Generated Code
        # Catches tracked files modified by the test and conformance runs.
        if: matrix.go-version.name == 'latest'
        run: make checkgenerate
  lint:
    # Often, lint & gofmt guidelines depend on the Go version. To prevent
    # conflicting guidance, run only on the most recent supported version.
    # For the same reason, only check generated code on the most recent
    # supported version.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Go
        id: go
        uses: actions/setup-go@v7
        with:
          # Keep in sync with the 'latest' Go version above.
          go-version: 1.27.x
          cache: false
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.sum', 'Makefile') }}
          restore-keys: ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-${{ github.job }}-
      - name: Check Generated Code
        run: make generate && make checkgenerate
      - name: Lint
        run: make lint
  checkrelease:
    # Releases are built with the most recent supported Go version, so that's
    # all we need to check.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Go
        id: go
        uses: actions/setup-go@v7
        with:
          # Keep in sync with the 'latest' Go version above.
          go-version: 1.27.x
          cache: false
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.sum', 'Makefile') }}
          restore-keys: ${{ runner.os }}-go-${{ steps.go.outputs.go-version }}-${{ github.job }}-
      - name: Check Release
        run: make checkrelease
