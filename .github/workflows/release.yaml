name: release
on:
  release:
    types: [published]
permissions:
  # need write permission to create/edit release and attach artifacts
  contents: write
jobs:
  release:
    # goreleaser publishes to connectrpc/conformance, which other repos can't write to.
    if: github.repository == 'connectrpc/conformance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          # Keep in sync with the 'latest' Go version in ci.yaml.
          go-version: 1.27.x
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
        run: make release
