# A charset parameter on a JSON content type must be utf-8, and any other
# parameter must be ignored.
name: Connect JSON Content-Type Parameter Responses
mode: TEST_MODE_CLIENT
relevantProtocols:
  - PROTOCOL_CONNECT
relevantCompressions:
  - COMPRESSION_IDENTITY
relevantCodecs:
  - CODEC_JSON
testCases:
  - request:
      testName: unary/charset-utf-8
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/json; charset=utf-8" ]
              unary:
                text: '{"payload": {"data": "dGVzdCByZXNwb25zZQ=="}}'
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: unary/charset-utf-8-uppercase
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/json; charset=UTF-8" ]
              unary:
                text: '{"payload": {"data": "dGVzdCByZXNwb25zZQ=="}}'
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: unary/charset-utf-8-quoted
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ 'application/json; charset="utf-8"' ]
              unary:
                text: '{"payload": {"data": "dGVzdCByZXNwb25zZQ=="}}'
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: unary/charset-utf-8-with-unknown-parameter
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/json; charset=utf-8; foo=bar" ]
              unary:
                text: '{"payload": {"data": "dGVzdCByZXNwb25zZQ=="}}'
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: unary/unknown-parameter
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/json; foo=bar" ]
              unary:
                text: '{"payload": {"data": "dGVzdCByZXNwb25zZQ=="}}'
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: unary/unsupported-charset
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/json; charset=iso-8859-1" ]
              unary:
                text: '{"payload": {"data": "dGVzdCByZXNwb25zZQ=="}}'
    expectedResponse:
      error:
        # the response codec does not match the request codec
        code: CODE_INTERNAL
  - request:
      testName: unary/unknown-parameter-then-charset-utf-8
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/json; foo=bar; charset=utf-8" ]
              unary:
                text: '{"payload": {"data": "dGVzdCByZXNwb25zZQ=="}}'
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: unary/unknown-parameter-then-unsupported-charset
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/json; foo=bar; charset=iso-8859-1" ]
              unary:
                text: '{"payload": {"data": "dGVzdCByZXNwb25zZQ=="}}'
    expectedResponse:
      error:
        # the response codec does not match the request codec
        code: CODE_INTERNAL
  - request:
      testName: server-stream/charset-utf-8
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/connect+json; charset=utf-8" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      text: '{"payload": {"data": "dGVzdCByZXNwb25zZQ=="}}'
                  - flags: 2
                    payload:
                      text: "{}"
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: server-stream/charset-utf-8-uppercase
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/connect+json; charset=UTF-8" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      text: '{"payload": {"data": "dGVzdCByZXNwb25zZQ=="}}'
                  - flags: 2
                    payload:
                      text: "{}"
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: server-stream/charset-utf-8-quoted
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
