# Unknown content-type parameters must be ignored.
name: Connect Proto Content-Type Parameter Responses
mode: TEST_MODE_CLIENT
relevantProtocols:
  - PROTOCOL_CONNECT
relevantCompressions:
  - COMPRESSION_IDENTITY
relevantCodecs:
  - CODEC_PROTO
testCases:
  - request:
      testName: unary/unknown-parameter
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/proto; foo=bar" ]
              unary:
                binary_message:
                  "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryResponse"
                  payload:
                    data: "dGVzdCByZXNwb25zZQ=="
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: server-stream/unknown-parameter
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            rawResponse:
              headers:
                - name: content-type
                  value: [ "application/connect+proto; foo=bar" ]
              stream:
                items:
                  - flags: 0
                    payload:
                      binary_message:
                        "@type": "type.googleapis.com/connectrpc.conformance.v1.ServerStreamResponse"
                        payload:
                          data: "dGVzdCByZXNwb25zZQ=="
                  - flags: 2
                    payload:
                      text: "{}"
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
