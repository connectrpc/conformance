# When present, a Connect timeout must be 1 to 10 ASCII decimal digits. This
# applies to GET requests too, where the timeout is still sent as a header.
# Servers must reject any other value; the spec doesn't define the error or
# HTTP status.
name: Connect GET Timeout Format Requests
mode: TEST_MODE_SERVER
relevantProtocols:
  - PROTOCOL_CONNECT
relevantCompressions:
  - COMPRESSION_IDENTITY
relevantCodecs:
  - CODEC_PROTO
relies_on_connect_get: true
testCases:
  - request:
      testName: ten-digits
      service: connectrpc.conformance.v1.ConformanceService
      method: IdempotentUnary
      streamType: STREAM_TYPE_UNARY
      useGetHttpMethod: true
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.IdempotentUnaryRequest
          responseDefinition:
            responseData: "dGVzdCByZXNwb25zZQ=="
      rawRequest:
        verb: GET
        uri: /connectrpc.conformance.v1.ConformanceService/IdempotentUnary
        headers:
          - name: connect-timeout-ms
            value: [ "9999999999" ]
        rawQueryParams:
          - name: encoding
            value: [ "proto" ]
          - name: base64
            value: [ "1" ]
          - name: connect
            value: [ "v1" ]
        encodedQueryParams:
          - name: message
            base64Encode: true
            value:
              binary_message:
                "@type": "type.googleapis.com/connectrpc.conformance.v1.IdempotentUnaryRequest"
                responseDefinition:
                  responseData: "dGVzdCByZXNwb25zZQ=="
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
          requestInfo:
            timeoutMs: 9999999999
            requests:
              - "@type": type.googleapis.com/connectrpc.conformance.v1.IdempotentUnaryRequest
                responseDefinition:
                  responseData: "dGVzdCByZXNwb25zZQ=="
            connectGetInfo:
              queryParams:
                - name: encoding
                  value: [ "proto" ]
                - name: connect
                  value: [ "v1" ]
