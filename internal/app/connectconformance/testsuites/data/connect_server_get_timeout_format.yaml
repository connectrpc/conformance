                responseDefinition:
                  responseData: "dGVzdCByZXNwb25zZQ=="
    otherAllowedErrorCodes:
      # gRPC servers reject a malformed grpc-timeout with internal.
      - CODE_INTERNAL
    expectedResponse:
      error:
        code: CODE_INVALID_ARGUMENT
