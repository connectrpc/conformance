            responseData: "dGVzdCByZXNwb25zZQ=="
      rawRequest:
        verb: POST
        uri: /connectrpc.conformance.v1.ConformanceService/Unary
        headers:
          - name: content-type
            value: [ 'application/json; charset="utf-8"' ]
          - name: connect-protocol-version
            value: [ "1" ]
        unary:
          text: '{"responseDefinition": {"responseData": "dGVzdCByZXNwb25zZQ=="}}'
  - request:
      testName: unary/charset-utf-8-with-unknown-parameter
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            responseData: "dGVzdCByZXNwb25zZQ=="
      rawRequest:
        verb: POST
        uri: /connectrpc.conformance.v1.ConformanceService/Unary
        headers:
          - name: content-type
            value: [ "application/json; charset=utf-8; foo=bar" ]
          - name: connect-protocol-version
            value: [ "1" ]
        unary:
          text: '{"responseDefinition": {"responseData": "dGVzdCByZXNwb25zZQ=="}}'
  - request:
      testName: unary/unknown-parameter
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            responseData: "dGVzdCByZXNwb25zZQ=="
      rawRequest:
        verb: POST
        uri: /connectrpc.conformance.v1.ConformanceService/Unary
        headers:
          - name: content-type
            value: [ "application/json; foo=bar" ]
          - name: connect-protocol-version
            value: [ "1" ]
        unary:
          text: '{"responseDefinition": {"responseData": "dGVzdCByZXNwb25zZQ=="}}'
  - request:
      testName: unary/unsupported-charset
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            responseData: "dGVzdCByZXNwb25zZQ=="
      rawRequest:
        verb: POST
        uri: /connectrpc.conformance.v1.ConformanceService/Unary
        headers:
          - name: content-type
            value: [ "application/json; charset=iso-8859-1" ]
          - name: connect-protocol-version
            value: [ "1" ]
        unary:
          text: '{"responseDefinition": {"responseData": "dGVzdCByZXNwb25zZQ=="}}'
    expectedResponse:
      httpStatusCode: 415
      error:
        # unknown, mapped from 415 status code
        code: CODE_UNKNOWN
  - request:
