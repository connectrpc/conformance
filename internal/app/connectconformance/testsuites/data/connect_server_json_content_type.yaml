# A charset parameter on a JSON content type must be utf-8, and any other
# parameter must be ignored.
name: Connect JSON Content-Type Parameter Requests
mode: TEST_MODE_SERVER
relevantProtocols:
  - PROTOCOL_CONNECT
relevantCompressions:
  - COMPRESSION_IDENTITY
relevantCodecs:
  - CODEC_JSON
testCases:
  - request:
      testName: unary/charset-utf-8
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            responseData: "dGVzdCByZXNwb25zZQ=="
      rawRequest:
        verb: POST
        uri: /connectrpc.conformance.v1.ConformanceService/Unary
        headers:
          - name: content-type
            value: [ "application/json; charset=utf-8" ]
          - name: connect-protocol-version
            value: [ "1" ]
        unary:
          text: '{"responseDefinition": {"responseData": "dGVzdCByZXNwb25zZQ=="}}'
  - request:
      testName: unary/charset-utf-8-uppercase
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            responseData: "dGVzdCByZXNwb25zZQ=="
      rawRequest:
        verb: POST
        uri: /connectrpc.conformance.v1.ConformanceService/Unary
        headers:
          - name: content-type
            value: [ "application/json; charset=UTF-8" ]
          - name: connect-protocol-version
            value: [ "1" ]
        unary:
          text: '{"responseDefinition": {"responseData": "dGVzdCByZXNwb25zZQ=="}}'
  - request:
      testName: unary/charset-utf-8-quoted
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
