# The charset parameter and unknown content-type parameters must be ignored
# for proto.
name: Connect Proto Content-Type Parameter Requests
mode: TEST_MODE_SERVER
relevantProtocols:
  - PROTOCOL_CONNECT
relevantCompressions:
  - COMPRESSION_IDENTITY
relevantCodecs:
  - CODEC_PROTO
testCases:
  - request:
      testName: unary/unknown-parameter
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            responseData: "dGVzdCByZXNwb25zZQ=="
      rawRequest:
        verb: POST
        uri: /connectrpc.conformance.v1.ConformanceService/Unary
        headers:
          - name: content-type
            value: [ "application/proto; foo=bar" ]
          - name: connect-protocol-version
            value: [ "1" ]
        unary:
          binary_message:
            "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryRequest"
            responseDefinition:
              responseData: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: unary/charset-ignored
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            responseData: "dGVzdCByZXNwb25zZQ=="
      rawRequest:
        verb: POST
        uri: /connectrpc.conformance.v1.ConformanceService/Unary
        headers:
          - name: content-type
            value: [ "application/proto; charset=iso-8859-1" ]
          - name: connect-protocol-version
            value: [ "1" ]
        unary:
          binary_message:
            "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryRequest"
            responseDefinition:
              responseData: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: server-stream/unknown-parameter
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            responseData:
              - "dGVzdCByZXNwb25zZQ=="
      rawRequest:
        verb: POST
        uri: /connectrpc.conformance.v1.ConformanceService/ServerStream
        headers:
          - name: content-type
            value: [ "application/connect+proto; foo=bar" ]
          - name: connect-protocol-version
            value: [ "1" ]
        stream:
          items:
            - flags: 0
              payload:
                binary_message:
                  "@type": "type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest"
                  responseDefinition:
                    responseData:
                      - "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: server-stream/charset-ignored
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            responseData:
              - "dGVzdCByZXNwb25zZQ=="
      rawRequest:
        verb: POST
        uri: /connectrpc.conformance.v1.ConformanceService/ServerStream
        headers:
          - name: content-type
            value: [ "application/connect+proto; charset=iso-8859-1" ]
          - name: connect-protocol-version
            value: [ "1" ]
        stream:
          items:
            - flags: 0
              payload:
                binary_message:
                  "@type": "type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest"
                  responseDefinition:
                    responseData:
                      - "dGVzdCByZXNwb25zZQ=="
