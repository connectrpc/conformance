# When present, a Connect timeout must be 1 to 10 ASCII decimal digits. Servers
# must reject any other value; the spec doesn't define the error or HTTP status.
name: Connect Timeout Format Requests
mode: TEST_MODE_SERVER
relevantProtocols:
  - PROTOCOL_CONNECT
relevantCompressions:
  - COMPRESSION_IDENTITY
relevantCodecs:
  - CODEC_PROTO
testCases:
  - request:
      testName: unary/ten-digits
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            responseData: "dGVzdCByZXNwb25zZQ=="
      rawRequest:
        verb: POST
        uri: /connectrpc.conformance.v1.ConformanceService/Unary
        headers:
          - name: content-type
            value: [ "application/proto" ]
          - name: connect-protocol-version
            value: [ "1" ]
          - name: connect-timeout-ms
            value: [ "9999999999" ]
        unary:
          binary_message:
            "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryRequest"
            responseDefinition:
              responseData: "dGVzdCByZXNwb25zZQ=="
    expectedResponse:
      payloads:
        - data: "dGVzdCByZXNwb25zZQ=="
          requestInfo:
            timeoutMs: 9999999999
            requests:
              - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
                responseDefinition:
                  responseData: "dGVzdCByZXNwb25zZQ=="
  - request:
      testName: unary/leading-zeros
      streamType: STREAM_TYPE_UNARY
      timeoutMs: 5000
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
