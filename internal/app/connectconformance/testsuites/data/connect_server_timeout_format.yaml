        headers:
          - name: content-type
            value: [ "application/proto" ]
          - name: connect-protocol-version
            value: [ "1" ]
          - name: connect-timeout-ms
            value: [ "0000005000" ]
        unary:
          binary_message:
            "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryRequest"
            responseDefinition:
              responseData: "dGVzdCByZXNwb25zZQ=="
  # Zero is a valid timeout, but the deadline has already passed.
  - request:
      testName: unary/zero
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            responseData: "dGVzdCByZXNwb25zZQ=="
      rawRequest:
        verb: POST
        uri: /connectrpc.conformance.v1.ConformanceService/Unary
        headers:
          - name: content-type
            value: [ "application/proto" ]
          - name: connect-protocol-version
            value: [ "1" ]
          - name: connect-timeout-ms
            value: [ "0" ]
        unary:
          binary_message:
            "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryRequest"
            responseDefinition:
              responseData: "dGVzdCByZXNwb25zZQ=="
    expectedResponse:
      error:
        code: CODE_DEADLINE_EXCEEDED
  # Present but empty is not the same as absent.
  - request:
