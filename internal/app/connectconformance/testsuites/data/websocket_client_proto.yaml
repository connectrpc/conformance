# Tests of how a Connect-over-WebSocket client handles frame types under the
# Protobuf codec. Section numbers refer to the Connect-over-WebSocket protocol
# specification.
#
# M and S are always JSON, so always text, even when binary is the negotiated
# frame type. §5: a client reports a protocol error in the server's response
# by failing the RPC with the code internal and closing with 3102.
#
# Where a test sets expectedClientCloseCodes, the reference server sends no
# Close frame of its own after the messages. It waits for the client to close
# the connection and checks the code.
name: WebSocket Client Proto Framing
mode: TEST_MODE_CLIENT
relevantProtocols:
  - PROTOCOL_CONNECT_WEBSOCKET
relevantCodecs:
  - CODEC_PROTO
relevantCompressions:
  - COMPRESSION_IDENTITY
testCases:
  # §6.1: on a Protobuf connection, bodies are binary while M and S are text.
  - request:
      testName: framing/mixed-frame-types
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_BINARY, marker: "B", contents: { binary_message: { "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryResponse", "payload": { "data": "AQID" } } } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
    expectedResponse:
      payloads:
        - data: "AQID"

  # §6.1, §7.3: M is always JSON, so always text, even though binary is the
  # negotiated frame type. An M in a binary frame is a protocol error even if
  # its payload parses.
  - request:
      testName: framing/metadata-in-binary-frame
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_BINARY, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_BINARY, marker: "B", contents: { binary_message: { "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryResponse", "payload": { "data": "AQID" } } } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL

  # §6.1, §9: S is always JSON, so always text, even though binary is the
  # negotiated frame type.
  - request:
      testName: framing/end-stream-in-binary-frame
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_BINARY, marker: "B", contents: { binary_message: { "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryResponse", "payload": { "data": "AQID" } } } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_BINARY, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL

  # §6.1: the negotiated frame type for bodies is binary, so a B in a text
  # frame is a protocol error.
  - request:
      testName: framing/body-in-text-frame
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { binary_message: { "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryResponse", "payload": { "data": "AQID" } } } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL

  # §6.1: an empty B payload goes to the codec like any other. Under Protobuf
  # it is the empty message, so the RPC succeeds.
  - request:
      testName: framing/empty-binary-body
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_BINARY, marker: "B" }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
    expectedResponse:
      payloads:
        - {}

  # §5, §6.1: a B payload that fails to decode is a protocol error reported as
  # invalid_argument. 0xFF begins a varint tag that never ends, so it is not a
  # Protobuf message.
  - request:
      testName: framing/undecodable-binary-body
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_BINARY, marker: "B", contents: { binary: "/w==" } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INVALID_ARGUMENT
