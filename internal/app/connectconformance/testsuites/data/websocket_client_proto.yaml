# Tests of how a Connect-over-WebSocket client handles frame types under the
# Protobuf codec. Section numbers refer to the Connect-over-WebSocket protocol
# specification.
#
# M and S are always JSON, so always text, even when binary is the negotiated
# frame type. The specification does not name the error code with which a
# client reports a protocol error in the server's response. Like the Connect
# suites, these tests expect internal, and also accept unknown.
#
# Where a test sets expectedClientCloseCodes, the reference server sends no
# Close frame of its own after the messages. It waits for the client to close
# the connection and checks the code, and that a 3102 carries a reason (§13).
name: WebSocket Client Proto Framing
mode: TEST_MODE_CLIENT
relevantProtocols:
  - PROTOCOL_CONNECT_WEBSOCKET
relevantCodecs:
  - CODEC_PROTO
relevantCompressions:
  - COMPRESSION_IDENTITY
testCases:
  # §6.1: on a Protobuf connection, bodies are binary while M and S are text.
  - request:
      testName: framing/mixed-frame-types
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '{}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_BINARY, marker: "B", contents: { binary_message: { "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryResponse", "payload": { "data": "AQID" } } } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
    expectedResponse:
      payloads:
        - data: "AQID"

  # §6.1, §7.3: M is always JSON, so always text, even though binary is the
  # negotiated frame type. An M in a binary frame is a protocol error even if
  # its payload parses.
  - request:
      testName: framing/metadata-in-binary-frame
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_BINARY, marker: "M", contents: { text: '{}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_BINARY, marker: "B", contents: { binary_message: { "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryResponse", "payload": { "data": "AQID" } } } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §6.1, §9: S is always JSON, so always text, even though binary is the
  # negotiated frame type.
  - request:
      testName: framing/end-stream-in-binary-frame
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '{}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_BINARY, marker: "B", contents: { binary_message: { "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryResponse", "payload": { "data": "AQID" } } } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_BINARY, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]
