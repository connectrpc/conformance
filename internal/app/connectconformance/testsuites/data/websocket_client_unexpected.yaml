# Tests of how a Connect-over-WebSocket client handles unexpected responses
# from a server. Section numbers refer to the Connect-over-WebSocket protocol
# specification.
#
# The specification does not name the error code with which a client reports a
# protocol error in the server's response. Like the Connect suites, these tests
# expect internal, and also accept unknown.
#
# Where a test sets expectedClientCloseCodes, the reference server sends no
# Close frame of its own after the messages. It waits for the client to close
# the connection and checks the code. 3102 is the only error code a client may
# send (§13), so the reference server also requires a 3102 Close frame to carry
# a reason.
name: WebSocket Client Unexpected Responses
mode: TEST_MODE_CLIENT
relevantProtocols:
  - PROTOCOL_CONNECT_WEBSOCKET
relevantCodecs:
  - CODEC_JSON
relevantCompressions:
  - COMPRESSION_IDENTITY
testCases:
  # §5, §7.3: every response stream opens with an M message.
  - request:
      testName: framing/first-message-not-metadata
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §7.3: a stream carries exactly one M message.
  - request:
      testName: framing/second-metadata
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §7.3: M may not follow a body.
  - request:
      testName: framing/metadata-after-body
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §5: an unrecognized marker is a protocol error, never skipped.
  - request:
      testName: framing/unknown-marker
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "X", contents: { text: '{}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §5.1: a first byte with the high bit set is a protocol error.
  - request:
      testName: framing/high-bit-marker
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_BINARY, contents: { binary: "gA==" } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §5: C is valid only from a client.
  - request:
      testName: framing/client-marker-from-server
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "C" }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §5: a message with no marker is a protocol error.
  - request:
      testName: framing/empty-message
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §6.1: an empty JSON message is {}, so a text frame with only B is a protocol error.
  - request:
      testName: framing/empty-json-body
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B" }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §6.1, §7.3: M is always JSON, so always text. A binary frame says its payload
  # is Protobuf, so an M in one is a protocol error even if its payload parses.
  - request:
      testName: framing/metadata-in-binary-frame
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_BINARY, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §6.1, §9: S is always JSON, so always text.
  - request:
      testName: framing/end-stream-in-binary-frame
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_BINARY, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §6.1, §13: a body in a frame type that does not match the negotiated codec is
  # rejected. A client has no code more specific than 3102 for it.
  - request:
      testName: framing/body-in-binary-frame
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_BINARY, marker: "B", contents: { binary_message: { "@type": "type.googleapis.com/connectrpc.conformance.v1.UnaryResponse" } } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §6.1: a non-browser client treats invalid UTF-8 in a text message as a
  # protocol error (3102). A browser closes with 1007 itself, or with 1002.
  - request:
      testName: framing/invalid-utf8
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { binary: "//4=" } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102, 1007, 1002 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §9: an S message with no payload is a protocol error.
  - request:
      testName: end-stream/bare
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S" }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §9: the payload of S is a JSON EndStreamResponse.
  - request:
      testName: end-stream/not-json
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: 'not json' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §7.3.1: keys that fold to the same lower-case form are a protocol error.
  - request:
      testName: metadata/duplicate-key-differing-case
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[["x-test", "a"], ["X-Test", "b"]]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §7.3.1: a client must also treat two entries with an identical key as a
  # protocol error.
  - request:
      testName: metadata/duplicate-key
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[["x-test", "a"], ["x-test", "b"]]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §7.3.1: the payload of M is a JSON array, not a JSON object.
  - request:
      testName: metadata/object-not-array
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '{"x-test": ["a"]}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §7.3.1: the payload of M is a JSON array; null is not one.
  - request:
      testName: metadata/null
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: 'null' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §7.3.1: the value of a -bin key that is not base64 is a protocol error.
  - request:
      testName: metadata/binary-not-base64
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[["x-test-bin", "!!!"]]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]

  # §9, §13.1: a connection that closes without S is a failed RPC, even with
  # close code 1000.
  - request:
      testName: end-stream/missing-normal-close
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
    expectedResponse:
      error:
        code: CODE_UNAVAILABLE
    otherAllowedErrorCodes: [ CODE_INTERNAL, CODE_UNKNOWN ]

  # §13.1: a connection that ends without S or a Close frame is a failed RPC.
  - request:
      testName: end-stream/missing-abnormal-close
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
              omitClose: true
    expectedResponse:
      error:
        code: CODE_UNAVAILABLE
    otherAllowedErrorCodes: [ CODE_INTERNAL, CODE_UNKNOWN ]

  # §9, §13.1: the same holds for a stream that has delivered messages.
  - request:
      testName: end-stream/server-stream-missing
      streamType: STREAM_TYPE_SERVER_STREAM
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.ServerStreamRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
    expectedResponse:
      error:
        code: CODE_UNAVAILABLE
      payloads:
        - data: "AQID"
    otherAllowedErrorCodes: [ CODE_INTERNAL, CODE_UNKNOWN ]

  # §13: once S has arrived, the RPC is complete. A connection that then ends
  # without a Close frame (1006) is not a transport failure.
  - request:
      testName: end-stream/abnormal-close-after-end
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{}' } }
              omitClose: true
    expectedResponse:
      payloads:
        - data: "AQID"

  # §7.4: leading metadata and the metadata of S are separate namespaces, and a
  # receiver surfaces both, as headers and trailers.
  - request:
      testName: metadata/headers-and-trailers
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[["x-test", "header"]]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{"payload": {"data": "AQID"}}' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{"metadata": {"x-test": ["trailer"]}}' } }
    expectedResponse:
      payloads:
        - data: "AQID"
      responseHeaders:
        - name: x-test
          value: [ "header" ]
      responseTrailers:
        - name: x-test
          value: [ "trailer" ]

  # §9: S carries the RPC's error, in the Connect error format.
  - request:
      testName: end-stream/error
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '[]' } }
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{"error": {"code": "resource_exhausted", "message": "oops"}}' } }
    expectedResponse:
      error:
        code: CODE_RESOURCE_EXHAUSTED
        message: "oops"

  # §9: an error with no body before it still opens with M.
  - request:
      testName: end-stream/error-without-metadata
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            rawWebsocketResponse:
              messages:
                - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "S", contents: { text: '{"error": {"code": "resource_exhausted"}}' } }
              expectedClientCloseCodes: [ 3102 ]
    expectedResponse:
      error:
        code: CODE_INTERNAL
    otherAllowedErrorCodes: [ CODE_UNKNOWN ]
