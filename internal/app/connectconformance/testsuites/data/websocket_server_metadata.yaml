# Tests of how a Connect-over-WebSocket server handles request metadata. Section
# numbers refer to the Connect-over-WebSocket protocol specification.
#
# The specification does not name the error code that reports a protocol
# error, so these tests accept the codes a server could reasonably use.
name: WebSocket Server Metadata
mode: TEST_MODE_SERVER
relevantProtocols:
  - PROTOCOL_CONNECT_WEBSOCKET
relevantCodecs:
  - CODEC_JSON
relevantCompressions:
  - COMPRESSION_IDENTITY
testCases:
  # §7.3.1: values are arrays of strings.
  - request:
      testName: metadata/value-not-array
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
      rawWebsocketRequest:
        messages:
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '{"x-test": "value"}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "C" }
    expectedResponse:
      httpStatusCode: 101
      websocketCloseCode: 1002
      error:
        code: CODE_INVALID_ARGUMENT
    otherAllowedErrorCodes: [ CODE_INTERNAL, CODE_UNKNOWN ]

  # §7.3.1: the payload of M is a JSON object.
  - request:
      testName: metadata/not-an-object
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
      rawWebsocketRequest:
        messages:
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '["x-test"]' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "C" }
    expectedResponse:
      httpStatusCode: 101
      websocketCloseCode: 1002
      error:
        code: CODE_INVALID_ARGUMENT
    otherAllowedErrorCodes: [ CODE_INTERNAL, CODE_UNKNOWN ]

  # §7.3.1: keys that fold to the same lower-case form are one key, so an
  # object with both is a protocol error.
  - request:
      testName: metadata/duplicate-key-differing-case
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
      rawWebsocketRequest:
        messages:
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '{"x-test": ["a"], "X-Test": ["b"]}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "C" }
    expectedResponse:
      httpStatusCode: 101
      websocketCloseCode: 1002
      error:
        code: CODE_INVALID_ARGUMENT
    otherAllowedErrorCodes: [ CODE_INTERNAL, CODE_UNKNOWN ]

  # §7.3.1: a server must also treat two identical keys as a protocol error.
  - request:
      testName: metadata/duplicate-key
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
      rawWebsocketRequest:
        messages:
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '{"x-test": ["a"], "x-test": ["b"]}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "C" }
    expectedResponse:
      httpStatusCode: 101
      websocketCloseCode: 1002
      error:
        code: CODE_INVALID_ARGUMENT
    otherAllowedErrorCodes: [ CODE_INTERNAL, CODE_UNKNOWN ]

  # §7.3.1: keys must be valid HTTP field names.
  - request:
      testName: metadata/invalid-key
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
      rawWebsocketRequest:
        messages:
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '{"x test": ["a"]}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "C" }
    expectedResponse:
      httpStatusCode: 101
      websocketCloseCode: 1002
      error:
        code: CODE_INVALID_ARGUMENT
    otherAllowedErrorCodes: [ CODE_INTERNAL, CODE_UNKNOWN ]

  # §7.3.1: values must not contain CR, LF, or NUL.
  - request:
      testName: metadata/invalid-value
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
      rawWebsocketRequest:
        messages:
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '{"x-test": ["a\nb"]}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "C" }
    expectedResponse:
      httpStatusCode: 101
      websocketCloseCode: 1002
      error:
        code: CODE_INVALID_ARGUMENT
    otherAllowedErrorCodes: [ CODE_INTERNAL, CODE_UNKNOWN ]

  # §7.3.1: the value of a -bin key that is not base64 is a protocol error.
  - request:
      testName: metadata/binary-not-base64
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
      rawWebsocketRequest:
        messages:
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '{"x-test-bin": ["!!!"]}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "C" }
    expectedResponse:
      httpStatusCode: 101
      websocketCloseCode: 1002
      error:
        code: CODE_INVALID_ARGUMENT
    otherAllowedErrorCodes: [ CODE_INTERNAL, CODE_UNKNOWN ]

  # §7.3.1: a receiver validates that a -bin value is base64, accepting the
  # unpadded form.
  - request:
      testName: metadata/binary-unpadded
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
      rawWebsocketRequest:
        messages:
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '{"x-test-bin": ["aGVsbG8"]}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "C" }
    expectedResponse:
      httpStatusCode: 101
      websocketCloseCode: 1000
      payloads:
        - requestInfo:
            requestHeaders:
              - name: x-test-bin
                value: [ "aGVsbG8" ]
            requests:
              - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest

  # §7.3.1: a receiver must also accept padded base64.
  - request:
      testName: metadata/binary-padded
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
      rawWebsocketRequest:
        messages:
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '{"x-test-bin": ["aGVsbG8="]}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "C" }
    expectedResponse:
      httpStatusCode: 101
      websocketCloseCode: 1000
      payloads:
        - requestInfo:
            requestHeaders:
              - name: x-test-bin
                value: [ "aGVsbG8=" ]
            requests:
              - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest

  # §7.3.1: a receiver must accept a key whose value is an empty array.
  - request:
      testName: metadata/empty-values
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
      rawWebsocketRequest:
        messages:
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '{"x-empty": []}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "C" }
    expectedResponse:
      httpStatusCode: 101
      websocketCloseCode: 1000
      payloads:
        - requestInfo:
            requests:
              - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest

  # §7.3.1: keys are case-insensitive.
  - request:
      testName: metadata/mixed-case-key
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
      rawWebsocketRequest:
        messages:
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '{"X-Mixed-Case": ["value"]}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "C" }
    expectedResponse:
      httpStatusCode: 101
      websocketCloseCode: 1000
      payloads:
        - requestInfo:
            requestHeaders:
              - name: x-mixed-case
                value: [ "value" ]
            requests:
              - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest

  # §7.1: every handshake header is made available as request metadata.
  - request:
      testName: metadata/handshake-header
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
      rawWebsocketRequest:
        headers:
          - name: x-from-handshake
            value: [ "value" ]
        messages:
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '{}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "C" }
    expectedResponse:
      httpStatusCode: 101
      websocketCloseCode: 1000
      payloads:
        - requestInfo:
            requestHeaders:
              - name: x-from-handshake
                value: [ "value" ]
            requests:
              - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest

  # §7.3: a key in M replaces the value the handshake carried for it.
  - request:
      testName: metadata/overrides-handshake
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
      rawWebsocketRequest:
        headers:
          - name: x-test
            value: [ "from-handshake" ]
        messages:
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '{"x-test": ["from-metadata"]}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "C" }
    expectedResponse:
      httpStatusCode: 101
      websocketCloseCode: 1000
      payloads:
        - requestInfo:
            requestHeaders:
              - name: x-test
                value: [ "from-metadata" ]
            requests:
              - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest

  # §7.3.2: a client may not set cookie in M, because the Fetch standard forbids it. The server
  # must end the RPC with an error rather than ignore the key.
  - request:
      testName: reserved/cookie
      streamType: STREAM_TYPE_UNARY
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
      rawWebsocketRequest:
        messages:
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "M", contents: { text: '{"cookie": ["value"]}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "B", contents: { text: '{}' } }
          - { type: WEB_SOCKET_MESSAGE_TYPE_TEXT, marker: "C" }
    expectedResponse:
      httpStatusCode: 101
      error:
        code: CODE_INVALID_ARGUMENT
    otherAllowedErrorCodes: [ CODE_INTERNAL, CODE_UNKNOWN ]

